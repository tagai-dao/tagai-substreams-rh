      - map: map_nutbox_mining_factory_events
      - store: store_nutbox_mining_parent_contracts
        mode: get
    output:
      type: proto:contract.v1.NutboxMiningEvents

  - name: store_nutbox_mining_child_contracts
    kind: store
    initialBlock: 23108467
    updatePolicy: set
    valueType: string
    inputs:
      - map: map_nutbox_mining_parent_events

  - name: map_nutbox_mining_child_events
    kind: map
    initialBlock: 23108467
    blockFilter:
      module: ethcommon:index_events
      query:
        string: "evt_sig:0x2da466a7b24304f47e87fa2e1e5a81b9831ce54fec19055ce277ca2f39ba42c4 || evt_sig:0x7a64d79878509820925daa6339976afdd4e1c50dc32bfae6820dd5792bd306a7 || evt_sig:0x4896181ff8f4543cc00db9fe9b6fb7e6f032b7eb772c72ab1ec1b4d2e03b9369 || evt_sig:0x302ece888b23f17e9addd0ad302c9b0d6619a5c38b718deb019638e29355c0fb || evt_sig:0x1a977003b349edbf8daeec5cc12a49118def262b5fb08fd665f2f6d27b427a5b || evt_sig:0x24c5aaf7bfbe3cf57a34657a764eab4bb09666b991e99640a16299a7bff8991b || evt_sig:0xfe7f80732cc46eec28e2407d5231fb2bbfa5f50aa132060ccc9351ef404a5508 || evt_sig:0x1ba6b13e1ad1190c9238c69cf5cf7cf751a265b3ed42898f7c2996afa2d4b557 || evt_sig:0xdacbdde355ba930696a362ea6738feb9f8bd52dfb3d81947558fd3217e23e325"
    inputs:
