  - name: map_index_broker_amm_events
    kind: map
    initialBlock: 52436657
    blockFilter:
      module: ethcommon:index_events
      query:
        string: "evt_sig:0x75087db584c8ddded7bace07dc76cccaa9775524c8f214303ac500f43c3f4bc4 || evt_sig:0xde098f7db57d91d7e2ecd09194e70cd4559276f83e0def943485cb49c4eab45b || evt_sig:0xce2ca929d781ed370291ed5a65cddec5f8b87363a5ba2d0f22fb3b44a3abffec || evt_sig:0x22419da9da3107c9958ae6cfbac3a98267c51d80a8223082371b865714ebaf71 || evt_sig:0x44bda66dab9320f5157fa343d54f000327d61b11c425ff01e2e871039e572d4b || evt_sig:0x9f27a63dc6cba3c465fd87aaa474e3d7f3f43b80c761cbe99ebb9416b24df475 || evt_sig:0x6478902cdcfe667750a3f9dcfb76bc32878637b584cf0372becedb7ad3595108 || evt_sig:0xebe3db09f5650582b4782506e0d272262129183570e55fcf8768dd6e91f8c0f6"
    inputs:
      - source: sf.ethereum.type.v2.Block
      - map: map_index_broker_factory_events
      - store: store_index_broker_amms
        mode: get
    output:
      type: proto:contract.v1.IndexBrokerEvents

  - name: store_index_broker_indexes
    kind: store
    initialBlock: 52436657
    updatePolicy: add
    valueType: int64
    inputs:
      - map: map_index_broker_factory_events
      - map: map_index_broker_pool_events
      - map: map_index_broker_amm_events

  - name: store_index_broker_accounts
    kind: store
    initialBlock: 52436657
    updatePolicy: set_if_not_exists
    valueType: int64
    inputs:
      - map: map_index_broker_pool_events
      - map: map_index_broker_amm_events

  - name: index_broker_db_out
    kind: map
    initialBlock: 52436657
    inputs:
      - map: map_index_broker_factory_events
      - map: map_index_broker_pool_events
      - map: map_index_broker_amm_events
      - store: store_index_broker_indexes
        mode: get
      - store: store_index_broker_accounts
        mode: get
    output:
      type: proto:sf.substreams.sink.database.v1.DatabaseChanges

  - name: map_walnut_factory_events
    kind: map
    initialBlock: 6922897
    blockFilter:
      module: ethcommon:index_events
      query:
        string: "evt_addr:0x24328dcca1ba54eee82e2993f021802e64290486 || evt_addr:0x7df32f7a177bcfe437a040579e3bea89dc99c023 || evt_addr:0x4ca57c64dfe1cf1be977093c75f9d9cdd1dd2e10 || evt_addr:0xddbaba530728b5b8939d7fddc334432490916e90"
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:contract.v1.WalnutEvents

  - name: store_walnut_contracts
    kind: store
    initialBlock: 6922897
    updatePolicy: set
    valueType: string
    inputs:
      - map: map_walnut_factory_events

  - name: map_nutbox_mining_factory_events
    kind: map
    initialBlock: 20525715
    blockFilter:
      module: ethcommon:index_events
      query:
        string: "evt_addr:0xb3a547f535bdc1b20eb6fd97b9524f893a75708c || evt_addr:0xb3ebb2f53ecaad85bba502a557f7f838aeff88e0"
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:contract.v1.NutboxMiningFactoryEvents

  # Parent mining pools are dynamically created. Keep an explicit allowlist so
  # events emitted by retired factories or unrelated contracts are ignored.
  - name: store_nutbox_mining_parent_contracts
    kind: store
    initialBlock: 20525715
    updatePolicy: set
    valueType: string
    inputs:
      - map: map_nutbox_mining_factory_events

  - name: map_nutbox_mining_parent_events
    kind: map
    initialBlock: 22375502
    blockFilter:
      module: ethcommon:index_events
      query:
        string: "evt_sig:0x773f7aae34f9cc2c57a3849a4fbf7e0a4db182b7e52a288b2cadf536daa119f3 || evt_sig:0x0d12a96208f78b6b173d4bc5f7de1d8a9377c4e33639c8ef954056f7d3508587 || evt_sig:0x8bcad579dfea1a7ff8261ce2d6a802d0b5b2c47a5312c01c1c9649f77b98e059 || evt_sig:0x655a7076047cfbad91f116664f089d13ec88275859a76f5f8e51d90a03fd80a1 || evt_sig:0xa02270409724ab2ef0cbf8f5c198a4f2693e2be21e66c222570aef73316b6643 || evt_sig:0x77d700030f2b268da198a926d3ccbf91f848f1ceb16a7b5658478a24c4320917 || evt_sig:0xf15bc1a16c526cf86779504ccec1c4a3fecd06870f7642e8c4593f4654b25840 || evt_sig:0x53dd952f18e75e99f1bd702351991dc2d8a52fba2c09fbde150664956f9e98a2 || evt_sig:0x878fe0fa783470ab12ed99491c54294f5a8441b0f1a27de57a3b1dc0c5693efb || evt_sig:0xf99bd767c79d28bc3186efc693c8b73d3ff44ff0881ddcf5f2a3cea20e543099 || evt_sig:0xd29feb834ce8f5b6ab195de35fdcd20a9ebc8acf6afa1dd0148ae766ad973bc5 || evt_sig:0x14ecee82453e7cb099dd99fde0fdb05bd31acf2ec5f55d54ae52493ec785b64d || evt_sig:0x0bef6c8193f9fb9071a84bfd42b49bc29b56aa83edd93e61f63808846198ec0a"
    inputs:
