specVersion: v0.1.0
package:
  name: tiptag_substreams
  version: v0.4.0
  url: https://github.com/donut33-social/tiptag-substreams
  description: TipTag protocol indexer with the current Basket deployment for Robinhood Chain Mainnet

imports:
    ethcommon: https://spkg.io/streamingfast/ethereum-common-v0.3.3.spkg

protobuf:
  files:
    - contract.proto
    - sf/substreams/sink/entity/v1/entity.proto
    - sf/substreams/sink/database/v1/database.proto
    - sf/substreams/sink/sql/v1/service.proto
  importPaths:
    - ./proto
  excludePaths:
    - google

binaries:
  default:
    type: wasm/rust-v1
    file: ./target/wasm32-unknown-unknown/release/substreams.wasm

modules:

  - name: map_walnut_factory_events
    kind: map
    initialBlock: 6922897
    blockFilter:
      module: ethcommon:index_events
      query:
        string: "evt_addr:0x24328dcca1ba54eee82e2993f021802e64290486 || evt_addr:0x7df32f7a177bcfe437a040579e3bea89dc99c023 || evt_addr:0x4ca57c64dfe1cf1be977093c75f9d9cdd1dd2e10 || evt_addr:0xddbaba530728b5b8939d7fddc334432490916e90"
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:contract.v1.WalnutEvents

  - name: store_walnut_contracts
    kind: store
    initialBlock: 6922897
    updatePolicy: set
    valueType: string
    inputs:
      - map: map_walnut_factory_events

  - name: map_nutbox_mining_factory_events
    kind: map
    initialBlock: 20525715
    blockFilter:
      module: ethcommon:index_events
      query:
        string: "evt_addr:0xb3a547f535bdc1b20eb6fd97b9524f893a75708c || evt_addr:0xb3ebb2f53ecaad85bba502a557f7f838aeff88e0"
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:contract.v1.NutboxMiningFactoryEvents

  # Parent mining pools are dynamically created. Keep an explicit allowlist so
  # events emitted by retired factories or unrelated contracts are ignored.
  - name: store_nutbox_mining_parent_contracts
    kind: store
    initialBlock: 20525715
    updatePolicy: set
    valueType: string
    inputs:
      - map: map_nutbox_mining_factory_events

  - name: map_nutbox_mining_parent_events
    kind: map
    initialBlock: 22375502
    blockFilter:
      module: ethcommon:index_events
      query:
        string: "evt_sig:0x773f7aae34f9cc2c57a3849a4fbf7e0a4db182b7e52a288b2cadf536daa119f3 || evt_sig:0x0d12a96208f78b6b173d4bc5f7de1d8a9377c4e33639c8ef954056f7d3508587 || evt_sig:0x8bcad579dfea1a7ff8261ce2d6a802d0b5b2c47a5312c01c1c9649f77b98e059 || evt_sig:0x655a7076047cfbad91f116664f089d13ec88275859a76f5f8e51d90a03fd80a1 || evt_sig:0xa02270409724ab2ef0cbf8f5c198a4f2693e2be21e66c222570aef73316b6643 || evt_sig:0x77d700030f2b268da198a926d3ccbf91f848f1ceb16a7b5658478a24c4320917 || evt_sig:0xf15bc1a16c526cf86779504ccec1c4a3fecd06870f7642e8c4593f4654b25840 || evt_sig:0x53dd952f18e75e99f1bd702351991dc2d8a52fba2c09fbde150664956f9e98a2 || evt_sig:0x878fe0fa783470ab12ed99491c54294f5a8441b0f1a27de57a3b1dc0c5693efb || evt_sig:0xf99bd767c79d28bc3186efc693c8b73d3ff44ff0881ddcf5f2a3cea20e543099 || evt_sig:0xd29feb834ce8f5b6ab195de35fdcd20a9ebc8acf6afa1dd0148ae766ad973bc5 || evt_sig:0x14ecee82453e7cb099dd99fde0fdb05bd31acf2ec5f55d54ae52493ec785b64d || evt_sig:0x0bef6c8193f9fb9071a84bfd42b49bc29b56aa83edd93e61f63808846198ec0a"
    inputs:
      - source: sf.ethereum.type.v2.Block
      - map: map_nutbox_mining_factory_events
      - store: store_nutbox_mining_parent_contracts
        mode: get
    output:
      type: proto:contract.v1.NutboxMiningEvents

  - name: store_nutbox_mining_child_contracts
    kind: store
    initialBlock: 23108467
    updatePolicy: set
    valueType: string
    inputs:
      - map: map_nutbox_mining_parent_events

  - name: map_nutbox_mining_child_events
    kind: map
    initialBlock: 23108467
    blockFilter:
      module: ethcommon:index_events
      query:
        string: "evt_sig:0x2da466a7b24304f47e87fa2e1e5a81b9831ce54fec19055ce277ca2f39ba42c4 || evt_sig:0x7a64d79878509820925daa6339976afdd4e1c50dc32bfae6820dd5792bd306a7 || evt_sig:0x4896181ff8f4543cc00db9fe9b6fb7e6f032b7eb772c72ab1ec1b4d2e03b9369 || evt_sig:0x302ece888b23f17e9addd0ad302c9b0d6619a5c38b718deb019638e29355c0fb || evt_sig:0x1a977003b349edbf8daeec5cc12a49118def262b5fb08fd665f2f6d27b427a5b || evt_sig:0x24c5aaf7bfbe3cf57a34657a764eab4bb09666b991e99640a16299a7bff8991b || evt_sig:0xfe7f80732cc46eec28e2407d5231fb2bbfa5f50aa132060ccc9351ef404a5508 || evt_sig:0x1ba6b13e1ad1190c9238c69cf5cf7cf751a265b3ed42898f7c2996afa2d4b557 || evt_sig:0xdacbdde355ba930696a362ea6738feb9f8bd52dfb3d81947558fd3217e23e325"
    inputs:
      - source: sf.ethereum.type.v2.Block
      - map: map_nutbox_mining_parent_events
      - store: store_nutbox_mining_child_contracts
        mode: get
    output:
      type: proto:contract.v1.NutboxMiningEvents

  - name: map_walnut_events
    kind: map
    initialBlock: 6922897
    # Dynamic addresses cannot be known by the static block index, but their
    # event signatures can. This prevents scanning full receipts in blocks
    # that cannot contain a Walnut template event.
    blockFilter:
      module: ethcommon:index_events
      query:
        string: "evt_sig:0xd9ddc9dcfa963ac8b810758254dfcbdd868ce81331581e7cfe5686f80cc0ed20 || evt_sig:0xb5ea2431f5202daeb0439a80df086a35ec0abfd105e20f5564a824062596c09e || evt_sig:0x5b904beeb70c84b12d4105e0582a752c5a2705717790e1a648a27ba8622b9786 || evt_sig:0x5d777218f34a12264a9fec685df1868059eeec6d632b17a1775a00089e57533a || evt_sig:0x8be0079c531659141344cd1fd0a4f28419497f9722a3daafe3b4186f6b6457e0 || evt_sig:0x2f4ae87a584f00dc35b043dd1c5ac839c1f41cd3a66e834d4e13faa6251634e6 || evt_sig:0x86a5cc8fe9af9ae68fb50f62885307a7755a30cbd290131644377f0bd94a7181 || evt_sig:0x6ef8cf0d66677b36d11ee4e51dbd733fcd95070b8c2eb524fb96952f26115cb2 || evt_sig:0x8752a472e571a816aea92eec8dae9baf628e840f4929fbcc2d155e6233ff68a7 || evt_sig:0xd1c19fbcd4551a5edfb66d43d2e337c04837afda3482b42bdf569a8fccdae5fb || evt_sig:0x9f1ec8c880f76798e7b793325d625e9b60e4082a553c98f42b6cda368dd60008 || evt_sig:0x0f0bc5b519ddefdd8e5f9e6423433aa2b869738de2ae34d58ebc796fc749fa0d || evt_sig:0x4896181ff8f4543cc00db9fe9b6fb7e6f032b7eb772c72ab1ec1b4d2e03b9369 || evt_sig:0xecd166d84cc70df22f629978f82e6662e5b2f4de982e131bb6c0a08bbf56a6bc"
    inputs:
      - source: sf.ethereum.type.v2.Block
      - map: map_walnut_factory_events
      - store: store_walnut_contracts
        mode: get
    output:
      type: proto:contract.v1.WalnutEvents

  - name: store_walnut_indexes
    kind: store
    initialBlock: 6922897
    updatePolicy: add
    valueType: int64
    inputs:
      - map: map_walnut_factory_events
      - map: map_walnut_events

  - name: store_walnut_owners
    kind: store
    initialBlock: 6922897
    updatePolicy: set
    valueType: string
    inputs:
      - map: map_walnut_factory_events
      - map: map_walnut_events

  - name: store_walnut_memberships
    kind: store
    initialBlock: 6922897
    updatePolicy: set_if_not_exists
    valueType: int64
    inputs:
      - map: map_walnut_factory_events
      - map: map_walnut_events

  - name: store_pre_walnut_accounts
    kind: store
    initialBlock: 6922897
    updatePolicy: set_if_not_exists
    valueType: string
    inputs:
      - map: map_ipshare_events
      - map: map_events
      - map: map_swap_events

  - name: store_token_accounts
    kind: store
    initialBlock: 6922897
    updatePolicy: set_if_not_exists
    valueType: string
    inputs:
      - map: map_token_events
      - store: store_pre_walnut_accounts
        mode: get
      - store: store_walnut_accounts
        mode: get

  - name: store_user_account_indexes
    kind: store
    initialBlock: 6922897
    updatePolicy: add
    valueType: int64
    inputs:
      - store: store_pre_walnut_accounts
        mode: deltas
      - store: store_token_accounts
        mode: deltas

  - name: store_walnut_accounts
    kind: store
    initialBlock: 6922897
    updatePolicy: set_if_not_exists
    valueType: string
    inputs:
      - map: map_walnut_factory_events
      - map: map_walnut_events
      - store: store_pre_walnut_accounts
        mode: get

  - name: store_walnut_account_indexes
    kind: store
    initialBlock: 6922897
    updatePolicy: add
    valueType: int64
    inputs:
      - store: store_walnut_accounts
        mode: deltas

  - name: map_ipshare_events
    kind: map
    initialBlock: 6922897
    blockFilter:
      module: ethcommon:index_events
      query:
        string: evt_addr:0x8a7b0d80fa92699ce3e5bb2c8fe404d6733796d1
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:contract.v1.IPShareEvents

  - name: store_ipshare_indexes
    kind: store
    initialBlock: 6922897
    updatePolicy: add
    valueType: int64
    inputs:
      - map: map_ipshare_events

  - name: store_ipshare_holder_balances
    kind: store
    initialBlock: 6922897
    updatePolicy: add
    valueType: bigint
    inputs:
      - map: map_ipshare_events

  - name: store_ipshare_stake_balances
    kind: store
    initialBlock: 6922897
    updatePolicy: add
    valueType: bigint
    inputs:
      - map: map_ipshare_events

  - name: map_events
    kind: map
    initialBlock: 6922897
    blockFilter:
      module: ethcommon:index_events
      query:
        string: evt_addr:0x6c75e165e52e9c1661a75041650be2d919ee02a1
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:contract.v1.Events

  # Basket indexing starts at the current protocol deployment. This boundary
  # prevents registrations from retired Basket deployments from entering the
  # dynamic address store.
  - name: map_basket_registry_events
    kind: map
    initialBlock: 18022342
    blockFilter:
      module: ethcommon:index_events
      query:
        string: evt_addr:0x1f997deb6c8ac7bb4134bc7c6bf23f623cda25c6
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:contract.v1.BasketRegistryEvents

  - name: store_basket_addresses
    kind: store
    initialBlock: 18022342
    updatePolicy: set
    valueType: int64
    inputs:
      - map: map_basket_registry_events

  - name: map_basket_events
    kind: map
    initialBlock: 18022342
    blockFilter:
      module: ethcommon:index_events
      query:
        string: "evt_addr:0xc6c999fa94199da470a17806f04de85036f02a88 || evt_addr:0xd96e197f139b78e9f74555701f699aa051e0a50e || evt_addr:0xc2526404423ed03ce8d2608f5b94300f0aafa1a2 || evt_addr:0x773c71be8b5e3c0c49d9576211d06e2f316aaf4a || evt_sig:0xc8ebb3117899d4977e166f3afca866eab0f7c92ff7ff409a7f0aae513f8ea415 || evt_sig:0xb178954b2b8d72198f669fcc42c6ab219225ed856f78566adab738f9fc0fca04 || evt_sig:0xd046302bdc39599e60a5981e59227dcd1c643f512f56f2e984390c3ac6eadedb || evt_sig:0x69a8abd422e0487bf4c2dba25bc00ea123691a6f14db12c2eb6aa9ab1ecc51ec || evt_sig:0x44193e6589368f66700032705cb4b8a760ac8eb5ece58921310857bcdede1e22 || evt_sig:0x00690ba9c38e6521dc26bc0d24ca6605f2ce1b07d886f650f8682d0f9f5ed051"
    inputs:
      - source: sf.ethereum.type.v2.Block
      - map: map_basket_registry_events
      - store: store_basket_addresses
        mode: get
    output:
      type: proto:contract.v1.BasketEvents

  # Migration proof-of-concept consumed by Graph Node. This initially exposes
  # Pump token discovery; the remaining legacy entities are added in later
  # migration slices.
  - name: graph_out
    kind: map
    initialBlock: 6922897
    inputs:
      - map: map_events
    output:
      type: proto:sf.substreams.sink.entity.v1.EntityChanges

  - name: store_token_addresses
    kind: store
    initialBlock: 6922897
    updatePolicy: set
    valueType: int64
    inputs:
      - map: map_events

  - name: map_token_events
    kind: map
    initialBlock: 6922897
    blockFilter:
      module: ethcommon:index_events
      query:
        # Transfer is intentionally excluded. Holder balances are refreshed
        # from RH Blockscout for both TagAI tokens and Basket tokens.
        string: "evt_sig:0x9adcf0ad0cda63c4d50f26a48925cf6405df27d422a39c456b5f03f661c82982 || evt_sig:0x74beebcb41508a3651f8ab8f6ee9318bcf2e721ec973e146d4a943360de308e8"
    inputs:
      - source: sf.ethereum.type.v2.Block
      - map: map_events
      - store: store_token_addresses
        mode: get
    output:
      type: proto:contract.v1.TokenEvents

  - name: map_swap_events
    kind: map
    initialBlock: 6922897
    blockFilter:
      module: ethcommon:index_events
      query:
        string: evt_addr:0x5e8e2d77ce0d2e04ba058bbcecc13c7c8adb20cc
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:contract.v1.TokenEvents

  - name: store_bonding_curve_supply
    kind: store
    initialBlock: 6922897
    updatePolicy: add
    valueType: bigint
    inputs:
      - map: map_token_events

  - name: store_entity_indexes
    kind: store
    initialBlock: 6922897
    updatePolicy: add
    valueType: int64
    inputs:
      - map: map_events
      - map: map_token_events
      - map: map_swap_events

  # Dedicated historical backfill path for the two new Nutbox mining types.
  # It can start at 20525715 without replaying existing TagAI/IPShare/Walnut
  # aggregates into an already populated database.
  - name: nutbox_mining_db_out
    kind: map
    initialBlock: 20525715
    inputs:
      - map: map_nutbox_mining_factory_events
      - map: map_nutbox_mining_parent_events
      - map: map_nutbox_mining_child_events
    output:
      type: proto:sf.substreams.sink.database.v1.DatabaseChanges

  # Replacement-only backfill sink. It intentionally excludes NFT mining
  # rows so the Basket TVL protocol can be cleared and replayed independently.
  - name: basket_tvl_mining_db_out
    kind: map
    initialBlock: 25576285
    inputs:
      - map: map_nutbox_mining_factory_events
      - map: map_nutbox_mining_parent_events
      - map: map_nutbox_mining_child_events
    output:
      type: proto:sf.substreams.sink.database.v1.DatabaseChanges

  # PostgreSQL production path. The first migration slice writes Pump token
  # discoveries; subsequent slices extend this output with mutable protocol
  # state and immutable event-history tables.
  - name: db_out
    kind: map
    initialBlock: 6922897
    inputs:
      - map: map_events
      - map: map_token_events
      - map: map_swap_events
      - map: map_ipshare_events
      - map: map_walnut_factory_events
      - map: map_walnut_events
      - map: map_nutbox_mining_factory_events
      - map: map_nutbox_mining_parent_events
      - map: map_nutbox_mining_child_events
      - map: map_basket_registry_events
      - map: map_basket_events
      - store: store_bonding_curve_supply
        mode: get
      - store: store_entity_indexes
        mode: get
      - store: store_ipshare_indexes
        mode: get
      - store: store_ipshare_holder_balances
        mode: deltas
      - store: store_ipshare_stake_balances
        mode: deltas
      - store: store_walnut_indexes
        mode: get
      - store: store_walnut_contracts
        mode: get
      - store: store_walnut_owners
        mode: get
      - store: store_walnut_memberships
        mode: deltas
      - store: store_pre_walnut_accounts
        mode: deltas
      - store: store_token_accounts
        mode: deltas
      - store: store_walnut_accounts
        mode: deltas
      - store: store_user_account_indexes
        mode: get
      - store: store_walnut_account_indexes
        mode: get
    output:
      type: proto:sf.substreams.sink.database.v1.DatabaseChanges

network: robinhood

sink:
  module: db_out
  type: sf.substreams.sink.sql.v1.Service
  config:
    engine: postgres
    schema: schema.sql
