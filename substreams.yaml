    valueType: int64
    inputs:
      - map: map_walnut_factory_events
      - map: map_walnut_events

  - name: store_walnut_owners
    kind: store
    initialBlock: 6922897
    updatePolicy: set
    valueType: string
    inputs:
      - map: map_walnut_factory_events
      - map: map_walnut_events

  - name: store_walnut_memberships
    kind: store
    initialBlock: 6922897
    updatePolicy: set_if_not_exists
    valueType: int64
    inputs:
      - map: map_walnut_factory_events
      - map: map_walnut_events

  - name: store_pre_walnut_accounts
    kind: store
    initialBlock: 6922897
    updatePolicy: set_if_not_exists
    valueType: string
    inputs:
      - map: map_ipshare_events
      - map: map_events
      - map: map_swap_events

  - name: store_token_accounts
    kind: store
    initialBlock: 6922897
    updatePolicy: set_if_not_exists
    valueType: string
    inputs:
      - map: map_token_events
      - store: store_pre_walnut_accounts
        mode: get
      - store: store_walnut_accounts
        mode: get

  - name: store_user_account_indexes
    kind: store
    initialBlock: 6922897
    updatePolicy: add
    valueType: int64
    inputs:
      - store: store_pre_walnut_accounts
        mode: deltas
      - store: store_token_accounts
        mode: deltas

  - name: store_walnut_accounts
    kind: store
    initialBlock: 6922897
    updatePolicy: set_if_not_exists
    valueType: string
    inputs:
      - map: map_walnut_factory_events
      - map: map_walnut_events
      - store: store_pre_walnut_accounts
        mode: get

  - name: store_walnut_account_indexes
    kind: store
    initialBlock: 6922897
    updatePolicy: add
    valueType: int64
    inputs:
      - store: store_walnut_accounts
        mode: deltas

  - name: map_ipshare_events
    kind: map
    initialBlock: 6922897
    blockFilter:
      module: ethcommon:index_events
      query:
        string: evt_addr:0x8a7b0d80fa92699ce3e5bb2c8fe404d6733796d1
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:contract.v1.IPShareEvents

  - name: store_ipshare_indexes
    kind: store
    initialBlock: 6922897
    updatePolicy: add
    valueType: int64
    inputs:
      - map: map_ipshare_events

  - name: store_ipshare_subjects
    kind: store
    initialBlock: 6922897
    updatePolicy: set
    valueType: int64
    inputs:
      - map: map_ipshare_events

  - name: store_ipshare_holder_balances
    kind: store
    initialBlock: 6922897
    updatePolicy: add
    valueType: bigint
    inputs:
      - map: map_ipshare_events

  - name: store_ipshare_stake_balances
    kind: store
    initialBlock: 6922897
    updatePolicy: add
    valueType: bigint
    inputs:
      - map: map_ipshare_events

  - name: map_events
    kind: map
    initialBlock: 6922897
    blockFilter:
      module: ethcommon:index_events
      query:
        string: "evt_addr:0x6c75e165e52e9c1661a75041650be2d919ee02a1 || evt_addr:0x7686cbaf2dfc7000eb9b0d6de81e48c1211d2655"
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:contract.v1.Events

  # The registry is shared by Basket V1 and V3. Starting at the V1 deployment
  # preserves all historical baskets while later version fields distinguish V3.
  - name: map_basket_registry_events
    kind: map
    initialBlock: 18022342
    blockFilter:
      module: ethcommon:index_events
      query:
        string: evt_addr:0x1f997deb6c8ac7bb4134bc7c6bf23f623cda25c6
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:contract.v1.BasketRegistryEvents

  - name: store_basket_addresses
    kind: store
    initialBlock: 18022342
    updatePolicy: set
    valueType: int64
    inputs:
      - map: map_basket_registry_events

  - name: map_basket_events
    kind: map
    initialBlock: 18022342
    blockFilter:
      module: ethcommon:index_events
      query:
        string: "evt_addr:0xc6c999fa94199da470a17806f04de85036f02a88 || evt_addr:0x7103aa53a7de0af737d1dc1a257838f6f488aa88 || evt_addr:0xd96e197f139b78e9f74555701f699aa051e0a50e || evt_addr:0x9b5e6b7cc3661737e6a118e0d4f0f89fb1034653 || evt_addr:0xc2526404423ed03ce8d2608f5b94300f0aafa1a2 || evt_addr:0x773c71be8b5e3c0c49d9576211d06e2f316aaf4a || evt_addr:0x1bca8a39021f6c65b62bbe79a59e41215cf19264 || evt_sig:0xc8ebb3117899d4977e166f3afca866eab0f7c92ff7ff409a7f0aae513f8ea415 || evt_sig:0xb178954b2b8d72198f669fcc42c6ab219225ed856f78566adab738f9fc0fca04 || evt_sig:0xd046302bdc39599e60a5981e59227dcd1c643f512f56f2e984390c3ac6eadedb || evt_sig:0x69a8abd422e0487bf4c2dba25bc00ea123691a6f14db12c2eb6aa9ab1ecc51ec || evt_sig:0x44193e6589368f66700032705cb4b8a760ac8eb5ece58921310857bcdede1e22 || evt_sig:0x00690ba9c38e6521dc26bc0d24ca6605f2ce1b07d886f650f8682d0f9f5ed051"
    inputs:
      - source: sf.ethereum.type.v2.Block
      - map: map_basket_registry_events
      - store: store_basket_addresses
        mode: get
    output:
      type: proto:contract.v1.BasketEvents

  # Migration proof-of-concept consumed by Graph Node. This initially exposes
  # Pump token discovery; the remaining legacy entities are added in later
  # migration slices.
  - name: graph_out
    kind: map
    initialBlock: 6922897
    inputs:
      - map: map_events
    output:
      type: proto:sf.substreams.sink.entity.v1.EntityChanges

  - name: store_token_addresses
    kind: store
    initialBlock: 6922897
    updatePolicy: set
    valueType: int64
    inputs:
      - map: map_events

  - name: map_token_events
    kind: map
    initialBlock: 6922897
    blockFilter:
      module: ethcommon:index_events
      query:
        # Transfer is intentionally excluded. Holder balances are refreshed
        # from RH Blockscout for both TagAI tokens and Basket tokens.
        string: "evt_sig:0x9adcf0ad0cda63c4d50f26a48925cf6405df27d422a39c456b5f03f661c82982 || evt_sig:0x74beebcb41508a3651f8ab8f6ee9318bcf2e721ec973e146d4a943360de308e8"
    inputs:
      - source: sf.ethereum.type.v2.Block
      - map: map_events
      - store: store_token_addresses
        mode: get
    output:
      type: proto:contract.v1.TokenEvents

  - name: map_swap_events
    kind: map
    initialBlock: 6922897
    blockFilter:
      module: ethcommon:index_events
      query:
        string: "evt_addr:0x5e8e2d77ce0d2e04ba058bbcecc13c7c8adb20cc || evt_addr:0x841dcad307a4444dc9e65f5709b2dc5e054c20cc"
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:contract.v1.TokenEvents

  - name: store_bonding_curve_supply
    kind: store
    initialBlock: 6922897
    updatePolicy: add
    valueType: bigint
    inputs:
      - map: map_token_events

  - name: store_entity_indexes
    kind: store
    initialBlock: 6922897
    updatePolicy: add
    valueType: int64
    inputs:
      - map: map_events
      - map: map_token_events
      - map: map_swap_events

  # Dedicated historical backfill path for the two new Nutbox mining types.
  # It can start at 20525715 without replaying existing TagAI/IPShare/Walnut
  # aggregates into an already populated database.
  - name: nutbox_mining_db_out
    kind: map
    initialBlock: 20525715
    inputs:
      - map: map_nutbox_mining_factory_events
      - map: map_nutbox_mining_parent_events
      - map: map_nutbox_mining_child_events
    output:
      type: proto:sf.substreams.sink.database.v1.DatabaseChanges

  # Replacement-only backfill sink. It intentionally excludes NFT mining
  # rows so the Basket TVL protocol can be cleared and replayed independently.
  - name: basket_tvl_mining_db_out
    kind: map
    initialBlock: 25576285
    inputs:
      - map: map_nutbox_mining_factory_events
      - map: map_nutbox_mining_parent_events
      - map: map_nutbox_mining_child_events
    output:
      type: proto:sf.substreams.sink.database.v1.DatabaseChanges

  - name: basket_db_out
    kind: map
    initialBlock: 18022342
    inputs:
      - map: map_basket_registry_events
      - map: map_basket_events
    output:
      type: proto:sf.substreams.sink.database.v1.DatabaseChanges

  # Keep the established RH domains in one compatibility writer. New domains
  # use independent writers so no module exceeds Substreams' 30-input limit.
  - name: legacy_db_out
    kind: map
    initialBlock: 6922897
    inputs:
      - map: map_events
      - map: map_token_events
      - map: map_swap_events
      - map: map_ipshare_events
      - map: map_walnut_factory_events
      - map: map_walnut_events
      - store: store_bonding_curve_supply
        mode: get
      - store: store_entity_indexes
        mode: get
      - store: store_ipshare_indexes
        mode: get
      - store: store_ipshare_holder_balances
        mode: deltas
      - store: store_ipshare_stake_balances
        mode: deltas
      - store: store_walnut_indexes
        mode: get
      - store: store_walnut_contracts
        mode: get
      - store: store_walnut_owners
        mode: get
      - store: store_walnut_memberships
        mode: deltas
      - store: store_pre_walnut_accounts
        mode: deltas
      - store: store_token_accounts
        mode: deltas
      - store: store_walnut_accounts
        mode: deltas
      - store: store_user_account_indexes
        mode: get
      - store: store_walnut_account_indexes
        mode: get
    output:
      type: proto:sf.substreams.sink.database.v1.DatabaseChanges

  # PostgreSQL production path. Domain writers are merged back into one
  # canonical, ordinal-sorted DatabaseChanges stream for the SQL sink.
  - name: db_out
    kind: map
    initialBlock: 6922897
    inputs:
      - map: legacy_db_out
      - map: basket_db_out
      - map: nutbox_mining_db_out
      - map: v11_protocol_db_out
      - map: index_broker_db_out
      - map: imported_trade_db_out
    output:
      type: proto:sf.substreams.sink.database.v1.DatabaseChanges

  # Historical V11-only sink. It is safe to start at 51,499,529 because it
  # excludes the legacy V0.4 database writer.
  - name: v11_backfill_db_out
    kind: map
    initialBlock: 51499529
    inputs:
      - map: v11_tagai_db_out
      - map: v11_basket_db_out
      - map: v11_protocol_db_out
      - map: index_broker_db_out
      - map: imported_trade_db_out
    output:
      type: proto:sf.substreams.sink.database.v1.DatabaseChanges

  # Final continuation sink. The package builder replaces `db_out` and every
  # shared dependency with the exact V0.4 production definitions and binaries.
  - name: v11_continuation_db_out
    kind: map
    initialBlock: 6922897
    inputs:
      - map: db_out
      - map: v11_tagai_db_out
      - map: v11_basket_db_out
      - map: v11_protocol_db_out
      - map: index_broker_db_out
      - map: imported_trade_db_out
    output:
      type: proto:sf.substreams.sink.database.v1.DatabaseChanges

network: robinhood

sink:
  module: db_out
  type: sf.substreams.sink.sql.v1.Service
  config:
    engine: postgres
    schema: schema.sql
